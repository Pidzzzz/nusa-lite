<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="NusaLite — a living notch for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080E"/>
      <stop offset="0.55" stop-color="#0A0E18"/>
      <stop offset="1" stop-color="#10182A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B8CFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#5B8CFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB45C" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFB45C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB45C"/>
      <stop offset="0.5" stop-color="#FF6F91"/>
      <stop offset="1" stop-color="#7C8CFF"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E6BFF"/>
      <stop offset="0.55" stop-color="#7A4BFF"/>
      <stop offset="1" stop-color="#FF6F91"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF7D4"/>
      <stop offset="1" stop-color="#39B8FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <circle cx="1110" cy="90" r="330" fill="url(#glow)"/>
  <circle cx="980" cy="360" r="300" fill="url(#glowWarm)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(78 78)">
      <rect x="0" y="0" width="44" height="44" rx="14" fill="#05060A" stroke="#2A3346"/>
      <circle cx="15" cy="22" r="3.2" fill="#FFFFFF"/>
      <circle cx="29" cy="22" r="3.2" fill="#FFFFFF"/>
      <text x="62" y="32" fill="#F2F5FF" font-size="24" font-weight="700" letter-spacing="-0.5">NusaLite</text>
    </g>

    <text x="78" y="190" fill="#FFFFFF" font-size="70" font-weight="750" letter-spacing="-2.4">A living notch</text>
    <text x="78" y="256" fill="#FFFFFF" font-size="70" font-weight="750" letter-spacing="-2.4">for Windows.</text>
    <text x="80" y="300" fill="#A8B2C8" font-size="19" font-weight="400">Media, synced lyrics, focus, water, shelf, and battery peek —</text>
    <text x="80" y="326" fill="#A8B2C8" font-size="19" font-weight="400">one calm surface at the top of your screen.</text>

    <g transform="translate(80 352)" font-size="12.5" font-weight="600" letter-spacing="0.4">
      <rect x="0" y="0" width="92" height="30" rx="15" fill="#0E1420" stroke="#243049"/>
      <text x="46" y="20" text-anchor="middle" fill="#D7DEEE">WPF</text>
      <rect x="102" y="0" width="110" height="30" rx="15" fill="#0E1420" stroke="#243049"/>
      <text x="157" y="20" text-anchor="middle" fill="#D7DEEE">.NET 8</text>
      <rect x="222" y="0" width="164" height="30" rx="15" fill="#0E1420" stroke="#243049"/>
      <text x="304" y="20" text-anchor="middle" fill="#D7DEEE">WINDOWS 10 / 11</text>
      <rect x="396" y="0" width="86" height="30" rx="15" fill="#0E1420" stroke="#243049"/>
      <text x="439" y="20" text-anchor="middle" fill="#D7DEEE">MIT</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="690" y="112" width="512" height="196" rx="38" fill="#000000"/>
      <rect x="690" y="112" width="512" height="196" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>

      <rect x="716" y="140" width="140" height="140" rx="30" fill="url(#art)"/>
      <circle cx="786" cy="210" r="40" fill="#FFFFFF" fill-opacity="0.12"/>
      <path d="M772 230 L772 192 L810 184 L810 222" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round"/>
      <circle cx="766" cy="232" r="10" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="804" cy="224" r="10" fill="#FFFFFF" fill-opacity="0.95"/>

      <text x="882" y="176" fill="#FFFFFF" font-size="22" font-weight="700">everything u are</text>
      <text x="882" y="201" fill="#97A3B8" font-size="14.5">Hindia — .25 on Blank Canvas</text>

      <rect x="882" y="220" width="230" height="4" rx="2" fill="#263044"/>
      <rect x="882" y="220" width="148" height="4" rx="2" fill="url(#accent)"/>

      <g fill="#E9EDF7">
        <path d="M887 250 l-13 9 v-18 z"/>
        <rect x="894" y="242" width="4" height="18" rx="2"/>
        <rect x="902" y="242" width="4" height="18" rx="2"/>
      </g>
      <circle cx="938" cy="251" r="19" fill="#FFFFFF"/>
      <path d="M933 242 l14 9 -14 9 z" fill="#05060A"/>
      <g fill="#E9EDF7">
        <rect x="970" y="242" width="4" height="18" rx="2"/>
        <rect x="978" y="242" width="4" height="18" rx="2"/>
        <path d="M992 250 l13 9 v-18 z"/>
      </g>

      <g transform="translate(1050 244)">
        <rect x="0" y="0" width="18" height="14" rx="4" fill="none" stroke="#E9EDF7" stroke-width="2"/>
        <path d="M22 5 v4" stroke="#E9EDF7" stroke-width="2" stroke-linecap="round"/>
        <path d="M4 7 l3 3 5-7" fill="none" stroke="#7CF7D4" stroke-width="2" stroke-linecap="round"/>
      </g>
      <rect x="1086" y="246" width="44" height="10" rx="5" fill="#263044"/>
      <circle cx="1104" cy="251" r="8" fill="#FFFFFF"/>

      <g transform="translate(1138 166)">
        <circle cx="30" cy="30" r="28" fill="none" stroke="#1D2638" stroke-width="6"/>
        <circle cx="30" cy="30" r="28" fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="round" stroke-dasharray="150 176" transform="rotate(-90 30 30)"/>
        <text x="30" y="35" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">100%</text>
      </g>
    </g>

    <g transform="translate(690 344)">
      <circle cx="8" cy="8" r="8" fill="#FF6F91"/>
      <text x="26" y="13" fill="#8E99AE" font-size="13">Now playing · live from Windows media sessions</text>
    </g>
  </g>

  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)" opacity="0.9"/>
</svg>
