name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "1.2.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish single-file exe
        run: dotnet publish NusaLite.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NusaLite v${{ steps.ver.outputs.version }}
          files: publish/NusaLite.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
